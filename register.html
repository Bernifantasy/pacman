<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <title>Registre</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
</head>
<style>
    .header-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
</style>

<body class=" w3-light-grey">

    <header class="w3-container w3-yellow w3-center w3-padding-32">
        <div class="header-content">
            <img src="img/bob2.png" height="100px" alt="" class="header-img">
            <h1>Benvingut al Joc de Spongebob</h1>
            <img src="img/bob.png" height="100px" alt="" class="header-img">
        </div>

        <!-- Menu -->
        <div class="w3-margin-top" id="menu-buttons">
            <a href="index.html" class="w3-button w3-green w3-round w3-large">Inici</a>
        </div>
    </header>
    <div class="w3-card-4 w3-white w3-margin-top w3-padding" style="max-width: 500px; margin:auto;">
        <h2 class="w3-center">Registra't</h2>
        <form id="registerForm" class="w3-container">
            <label>Nom</label>
            <input class="w3-input w3-margin-bottom" id="nom" required>

            <label>Cognoms</label>
            <input class="w3-input w3-margin-bottom" id="cognoms" required>

            <label>Nom d'usuari</label>
            <input class="w3-input w3-margin-bottom" id="username" required>

            <label>Contrasenya</label>
            <input class="w3-input w3-margin-bottom" type="password" id="password" required>

            <label>Repeteix la contrasenya</label>
            <input class="w3-input w3-margin-bottom" type="password" id="repeat_password" required>


            <label>Data de naixement</label>
            <input class="w3-input w3-margin-bottom" type="date" id="data_naix" required>

            <label>Correu electrònic</label>
            <input class="w3-input w3-margin-bottom" type="email" id="mail" required>

            <button class="w3-button w3-blue w3-block" type="submit">Registrar</button>
        </form>
        <div class="w3-center w3-margin-top">
            <p>Ja tens compte? <a href="login.html">Inicia sessió</a></p>
        </div>
    </div>

    <script type="module">
        import { auth } from './js/auth.js';

        document.getElementById('registerForm').addEventListener('submit', e => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const repeatPassword = document.getElementById('repeat_password').value;

            if (password !== repeatPassword) {
                alert('Les contrasenyes no coincideixen!');
                return;
            }

            const user = {
                nom: document.getElementById('nom').value.trim(),
                cognoms: document.getElementById('cognoms').value.trim(),
                username: document.getElementById('username').value.trim(),
                password: password,
                data_naix: document.getElementById('data_naix').value,
                mail: document.getElementById('mail').value.trim()
            };

            if (auth.getUser(user.username)) {
                alert('Aquest nom d’usuari ja existeix!');
                return;
            }

            auth.saveUser(user);
            alert('Usuari registrat correctament!');
            window.location.href = 'login.html';
        });

    </script>
</body>

</html>
