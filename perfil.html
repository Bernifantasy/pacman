<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <title>El teu Perfil</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
</head>
<style>
    .header-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
</style>

<body class="w3-light-grey">

    <header class="w3-container w3-yellow w3-center w3-padding-32">
        <div class="header-content">
            <img src="img/bob2.png" height="100px" alt="" class="header-img">
            <h1>Benvingut al Joc de Spongebob</h1>
            <img src="img/bob.png" height="100px" alt="" class="header-img">
        </div>

        <!-- Menu -->
        <div class="w3-margin-top" id="menu-buttons">
            <a href="index.html" class="w3-button w3-green w3-round w3-large">Inici</a>
        </div>
    </header>

    <main class="w3-container w3-padding-32">
        <div class="w3-card-4 w3-white w3-padding" style="max-width: 600px; margin:auto;">
            <h2 class="w3-center">Les teves dades</h2>
            <div id="perfilData" class="w3-container w3-large">
                <!-- Informació del perfil es mostrarà aquí -->
            </div>
        </div>
    </main>

    <script type="module">
        import { auth } from './js/auth.js';

        const user = auth.currentUser();

        if (!user) {
            alert('Has d’iniciar sessió!');
            window.location.href = 'login.html';
        } else {
            const container = document.getElementById('perfilData');
            container.innerHTML = `
                <p><strong>Nom:</strong> ${user.nom}</p>
                <p><strong>Cognoms:</strong> ${user.cognoms}</p>
                <p><strong>Nom d'usuari:</strong> ${user.username}</p>
                <p><strong>Data de naixement:</strong> ${user.data_naix}</p>
                <p><strong>Correu electrònic:</strong> ${user.mail}</p>
            `;
        }

        window.logout = () => {
            auth.logout();
            window.location.href = 'login.html';
        };
    </script>

</body>

</html>
